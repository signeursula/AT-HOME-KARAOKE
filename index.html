<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>At-Home Karaoke</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231a1714'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff5a36'/%3E%3Ccircle cx='16' cy='16' r='1.5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;700;800&family=Shrikhand&display=swap" rel="stylesheet">
  <style>
/* ============================================================
   At-Home Karaoke — styles
   Light, white, a little retro, with pops of tomato / sun / rose
   ============================================================ */

@property --glow {
  syntax: '<color>';
  inherits: true;
  initial-value: #ff6a2b;
}

:root {
  --bg: #ffffff;
  --ink: #1a1714;
  --ink-2: #4a443d;
  --muted: #8f877c;
  --line: #eee8de;
  --cream: #faf3e6;
  --cream-2: #f1e6d1;
  --tomato: #ff5a36;
  --sun: #ffb627;
  --rose: #ff7eb0;
  --accent: var(--tomato);
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --display: 'Shrikhand', 'Georgia', serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'DM Mono', ui-monospace, 'Consolas', monospace;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

img { display: block; max-width: 100%; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
a { color: inherit; }

.mono {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
}

/* ---------- top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 22px clamp(16px, 4vw, 40px);
  position: relative;
  z-index: 5;
}

.logo {
  font-family: var(--display);
  font-size: clamp(22px, 2.4vw, 28px);
  text-decoration: none;
  color: var(--ink);
  text-shadow: 2px 2px 0 var(--sun);
  line-height: 1;
  white-space: nowrap;
}
.logo span { color: var(--tomato); }

.topbar-meta { color: var(--muted); display: flex; align-items: center; gap: 10px; }
.topbar-meta::before {
  content: '';
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--tomato);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--tomato) 22%, transparent);
}

.back {
  display: inline-flex; align-items: center; gap: 8px;
  text-decoration: none;
  padding: 9px 16px 9px 12px;
  border: 1.5px solid var(--ink);
  border-radius: 999px;
  background: #fff;
  box-shadow: 0 3px 0 var(--ink);
  transition: transform .2s var(--ease-out), box-shadow .2s var(--ease-out), background .2s;
}
.back:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--ink); background: var(--cream); }
.back:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.back svg { transition: transform .25s var(--ease-out); }
.back:hover svg { transform: translateX(-3px); }

/* ---------- retro stripes ---------- */
.stripes { display: grid; gap: 3px; padding-top: 6px; }
.stripes span { height: 5px; }
.stripes span:nth-child(1) { background: var(--tomato); }
.stripes span:nth-child(2) { background: var(--sun); }
.stripes span:nth-child(3) { background: var(--rose); }

/* ---------- buttons ---------- */
.round-btn {
  width: 52px; height: 52px;
  border-radius: 50%;
  border: 1.5px solid var(--ink);
  background: #fff;
  display: grid; place-items: center;
  cursor: pointer;
  box-shadow: 0 3px 0 var(--ink);
  transition: transform .2s var(--ease-out), box-shadow .2s var(--ease-out), background .2s, color .2s;
}
.round-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--ink); background: var(--sun); }
.round-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

.pill-btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 26px;
  border-radius: 999px;
  border: 1.5px solid var(--ink);
  background: var(--tomato);
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: .01em;
  cursor: pointer;
  box-shadow: 0 3px 0 var(--ink);
  transition: transform .2s var(--ease-out), box-shadow .2s var(--ease-out), background .3s;
}
.pill-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--ink); }
.pill-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.pill-btn svg { transition: transform .3s var(--ease-out); }
.pill-btn:hover svg { transform: translateX(4px); }

:focus-visible { outline: 2.5px solid var(--tomato); outline-offset: 3px; }

/* ============================================================
   HOME — the record carousel
   ============================================================ */
.home {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  padding-bottom: 12px;
  --S: 400px;
}

.glow {
  position: absolute;
  left: 50%;
  top: 50%;
  width: calc(var(--S) * 1.9);
  height: calc(var(--S) * 1.3);
  transform: translate(-50%, -46%);
  background: radial-gradient(closest-side, color-mix(in srgb, var(--glow) 26%, transparent), color-mix(in srgb, var(--glow) 8%, transparent) 55%, transparent);
  transition: --glow .8s ease;
  pointer-events: none;
  z-index: 0;
  animation: fadeIn 1.4s ease both .2s;
}

.now {
  text-align: center;
  position: relative;
  z-index: 2;
  min-height: 112px;
  padding: 0 16px;
}
.now > * { will-change: transform, opacity; }
.now-kicker { color: var(--muted); margin: 0 0 10px; }
.now-kicker b { color: var(--tomato); font-weight: 500; }
.now-title {
  margin: 0;
  font-weight: 800;
  font-size: clamp(26px, 3.2vw, 42px);
  letter-spacing: -.025em;
  line-height: 1.1;
}
.now-artist {
  margin: 4px 0 0;
  font-size: clamp(18px, 2vw, 26px);
  color: var(--ink-2);
  font-weight: 400;
}

.carousel {
  position: relative;
  width: 100%;
  height: calc(var(--S) + 56px);
  margin: 6px 0 10px;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
  z-index: 1;
  outline: none;
}
.carousel.dragging { cursor: grabbing; }

.disc {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--S);
  height: var(--S);
  margin: calc(var(--S) / -2) 0 0 calc(var(--S) / -2);
  padding: 0;
  border: 0;
  background: none;
  border-radius: 50%;
  cursor: pointer;
  will-change: transform, opacity;
  -webkit-tap-highlight-color: transparent;
}
.carousel.dragging .disc { cursor: grabbing; }
.disc:focus-visible { outline: none; }

.disc-lift {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  transition: transform .45s var(--ease-out), opacity .45s var(--ease-out);
  animation: discIn 1s var(--ease-out) backwards;
  animation-delay: var(--delay, 0ms);
}
.disc:hover .disc-lift { transform: translateY(-8px); }
.disc.is-center:hover .disc-lift { transform: translateY(-6px) scale(1.015); }

.disc-shadow {
  position: absolute;
  inset: 3%;
  border-radius: 50%;
  box-shadow:
    0 calc(var(--S) * .07) calc(var(--S) * .11) calc(var(--S) * -.05) rgba(26, 23, 20, .45),
    0 calc(var(--S) * .02) calc(var(--S) * .03) rgba(26, 23, 20, .18);
}

.disc-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  pointer-events: none;
  will-change: transform;
}

/* a light reflection that stays put while the record turns */
.disc-sheen, .platter-sheen {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  pointer-events: none;
  background:
    conic-gradient(from 200deg,
      transparent 0deg, rgba(255,255,255,.10) 18deg, transparent 40deg,
      transparent 180deg, rgba(255,255,255,.08) 198deg, transparent 222deg);
  mix-blend-mode: screen;
}

/* the "play me" ring around the centred record */
.disc-ring {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 2px dashed color-mix(in srgb, var(--glow) 70%, transparent);
  opacity: 0;
  transform: scale(.96);
  transition: opacity .35s ease, transform .5s var(--ease-out);
  pointer-events: none;
}
.disc.is-center:hover .disc-ring { opacity: 1; transform: scale(1); animation: ringSpin 14s linear infinite; }

.controls {
  display: flex;
  align-items: center;
  gap: 18px;
  position: relative;
  z-index: 2;
}

.dots {
  display: flex;
  gap: 8px;
  margin-top: 22px;
  position: relative;
  z-index: 2;
}
.dot {
  width: 9px; height: 9px;
  padding: 0;
  border-radius: 999px;
  border: 1.5px solid var(--ink);
  background: #fff;
  cursor: pointer;
  transition: width .45s var(--ease-spring), background .3s ease;
}
.dot:hover { background: var(--sun); }
.dot.active { width: 30px; background: var(--tomato); }

.hint {
  margin: 16px 0 0;
  color: var(--muted);
  font-size: 11px;
  text-align: center;
  padding: 0 16px;
  animation: fadeIn 1s ease both 1.1s;
}
.hint kbd {
  font-family: var(--mono);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 0 5px;
  color: var(--ink-2);
}

/* entrance */
.page-home .now { animation: rise .9s var(--ease-out) both .15s; }
.page-home .controls { animation: rise .9s var(--ease-out) both .45s; }
.page-home .dots { animation: rise .9s var(--ease-out) both .55s; }

/* leaving for a song page */
.is-leaving .disc:not(.is-center) .disc-lift { opacity: 0; transform: translateY(30px) scale(.9); }
.is-leaving .disc.is-center .disc-lift { transform: scale(1.1); transition-duration: .6s; }
.is-leaving .now,
.is-leaving .controls,
.is-leaving .dots,
.is-leaving .hint {
  opacity: 0;
  transform: translateY(-14px);
  transition: opacity .35s ease, transform .45s var(--ease-out);
}
.is-leaving .glow { opacity: 0; transition: opacity .5s ease; }
.page-song.is-leaving main { opacity: 0; transform: translateY(12px); transition: opacity .35s ease, transform .4s var(--ease-out); }

/* ============================================================
   SONG PAGE
   ============================================================ */
.song { flex: 1; width: 100%; }

.hero {
  max-width: 1200px;
  margin: 0 auto;
  padding: clamp(8px, 2vw, 24px) clamp(16px, 4vw, 40px) 72px;
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: clamp(32px, 5vw, 72px);
  align-items: center;
}

.deck {
  position: relative;
  animation: deckIn 1s var(--ease-out) both .05s;
}
.deck .glow {
  --glow: var(--accent);
  width: 120%;
  height: 120%;
  transform: translate(-50%, -50%);
}

.turntable {
  position: relative;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  aspect-ratio: 1.12;
  background:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,.7), transparent 50%),
    var(--cream);
  border: 2px solid var(--ink);
  border-radius: 28px;
  box-shadow: 7px 7px 0 var(--ink), 0 30px 60px -30px rgba(26,23,20,.35);
  z-index: 1;
}

.platter {
  position: absolute;
  left: 5.6%;
  top: 50%;
  width: 78%;
  aspect-ratio: 1;
  transform: translateY(-50%);
  border-radius: 50%;
  background: radial-gradient(circle, #2c2926 0%, #141210 70%);
  box-shadow: inset 0 0 0 5px #34302b, 0 16px 28px -12px rgba(0,0,0,.55);
}
.record {
  position: absolute;
  inset: 2.2%;
  width: 95.6%;
  height: 95.6%;
  border-radius: 50%;
  will-change: transform;
}
.spindle {
  position: absolute;
  left: 50%; top: 50%;
  width: 2.6%; aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff, #b9b2a6);
  box-shadow: 0 1px 2px rgba(0,0,0,.5);
}

.tonearm {
  position: absolute;
  left: 82%;
  top: 7%;
  width: 16%;
  height: auto;
  transform-origin: 50% 11.11%;
  transform: rotate(var(--arm, 0deg));
  transition: transform 1.3s cubic-bezier(.5, 0, .2, 1);
  filter: drop-shadow(4px 8px 5px rgba(26, 23, 20, .28));
  z-index: 2;
  overflow: visible;
}

.deck-panel {
  position: absolute;
  right: 4.5%;
  bottom: 6%;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--ink-2);
  font-size: 10px;
}
.led {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: #d8cfbf;
  border: 1.5px solid var(--ink);
  transition: background .3s, box-shadow .3s;
}
.is-playing .led { background: var(--tomato); box-shadow: 0 0 10px 2px color-mix(in srgb, var(--tomato) 60%, transparent); }

.deck-stripes {
  position: absolute;
  left: 5.6%;
  bottom: 4.2%;
  display: grid;
  gap: 2px;
  width: 9%;
}
.deck-stripes span { height: 3px; border-radius: 2px; }
.deck-stripes span:nth-child(1) { background: var(--tomato); }
.deck-stripes span:nth-child(2) { background: var(--sun); }
.deck-stripes span:nth-child(3) { background: var(--rose); }

/* info column */
.info > * { animation: rise .8s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 80ms + 180ms); }
.kicker { color: var(--muted); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.kicker::before { content: ''; width: 22px; height: 2px; background: var(--accent); }
.title {
  margin: 0;
  font-weight: 800;
  font-size: clamp(36px, 5.2vw, 68px);
  line-height: 1.02;
  letter-spacing: -.035em;
}
.artist {
  margin: 10px 0 0;
  font-size: clamp(20px, 2.2vw, 28px);
  color: var(--ink-2);
}
.artist em {
  font-family: var(--display);
  font-style: normal;
  color: var(--accent);
  font-size: .8em;
  margin-right: 4px;
}

.player {
  margin-top: 36px;
  display: flex;
  align-items: center;
  gap: 22px;
}

.play-btn {
  position: relative;
  flex: none;
  width: 78px; height: 78px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  display: grid;
  place-items: center;
  box-shadow: 0 4px 0 var(--ink);
  transition: transform .2s var(--ease-out), box-shadow .2s var(--ease-out);
}
.play-btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 6px 0 var(--ink); }
.play-btn:active { transform: translateY(3px) scale(.98); box-shadow: 0 1px 0 var(--ink); }
.play-btn:disabled { background: var(--cream-2); color: var(--muted); cursor: not-allowed; transform: none; box-shadow: 0 4px 0 var(--ink); }
.play-btn svg { position: absolute; width: 30px; height: 30px; transition: transform .4s var(--ease-spring), opacity .25s ease; }
.play-btn .i-pause { opacity: 0; transform: scale(.4) rotate(-90deg); }
.is-playing .play-btn .i-play { opacity: 0; transform: scale(.4) rotate(90deg); }
.is-playing .play-btn .i-pause { opacity: 1; transform: none; }
.play-btn::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  opacity: 0;
  pointer-events: none;
}
.is-playing .play-btn::after { animation: pulse 2s ease-out infinite; }

.player-body { flex: 1; min-width: 0; }
.status {
  color: var(--ink-2);
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 18px;
}
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.eq i { width: 3px; height: 30%; background: var(--accent); border-radius: 1px; transition: height .3s; }
.is-playing .eq i { animation: eq .9s ease-in-out infinite alternate; }
.is-playing .eq i:nth-child(2) { animation-duration: .7s; animation-delay: -.3s; }
.is-playing .eq i:nth-child(3) { animation-duration: 1.1s; animation-delay: -.6s; }
.is-playing .eq i:nth-child(4) { animation-duration: .8s; animation-delay: -.2s; }

.progress {
  --p: 0;
  position: relative;
  height: 22px;
  margin-top: 8px;
  cursor: pointer;
  touch-action: none;
}
.progress::before, .progress-fill {
  content: '';
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 6px;
  margin-top: -3px;
  border-radius: 999px;
}
.progress::before { background: var(--line); box-shadow: inset 0 0 0 1px #e4dccd; }
.progress-fill {
  background: var(--accent);
  transform-origin: left center;
  transform: scaleX(var(--p));
}
.progress-knob {
  position: absolute;
  top: 50%;
  left: calc(var(--p) * 100%);
  width: 18px; height: 18px;
  margin: -9px 0 0 -9px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--ink);
  box-shadow: 0 2px 0 var(--ink);
  transform: scale(.8);
  transition: transform .25s var(--ease-spring);
}
.progress:hover .progress-knob, .progress.scrubbing .progress-knob, .progress:focus-visible .progress-knob { transform: scale(1); }
.times { display: flex; justify-content: space-between; color: var(--muted); margin-top: 2px; font-size: 11px; }

.volume {
  margin-top: 22px;
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--ink-2);
  max-width: 260px;
}
.volume input { flex: 1; accent-color: var(--accent); cursor: pointer; }

.no-audio-note {
  margin-top: 18px;
  padding: 12px 16px;
  border: 1.5px dashed var(--muted);
  border-radius: 14px;
  color: var(--ink-2);
  font-size: 14px;
  background: var(--cream);
  max-width: 420px;
}
.no-audio-note code { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }

/* lyrics */
.lyrics-wrap {
  max-width: 820px;
  margin: 0 auto;
  padding: 0 clamp(16px, 4vw, 40px) 96px;
}
.lyrics-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 26px 0 22px;
  border-top: 2px solid var(--ink);
  margin-bottom: 36px;
  position: relative;
}
.lyrics-head::before {
  content: '';
  position: absolute;
  left: 0; top: 5px;
  width: 92px; height: 5px;
  background: linear-gradient(90deg, var(--tomato) 0 33.3%, var(--sun) 33.3% 66.6%, var(--rose) 66.6%);
}
.lyrics-head h2 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(30px, 3.4vw, 42px);
  text-shadow: 2px 2px 0 var(--sun);
  line-height: 1;
}
.size-ctrl { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.size-ctrl button {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1.5px solid var(--ink);
  background: #fff;
  cursor: pointer;
  font-weight: 700;
  box-shadow: 0 2px 0 var(--ink);
  transition: transform .15s var(--ease-out), box-shadow .15s, background .2s;
}
.size-ctrl button:hover { background: var(--sun); transform: translateY(-1px); box-shadow: 0 3px 0 var(--ink); }
.size-ctrl button:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink); }

.lyrics { --lyric-size: 24px; }
.stanza { margin: 0 0 1.7em; font-size: var(--lyric-size); transition: font-size .3s var(--ease-out); }
.stanza .line { display: block; font-weight: 500; line-height: 1.55; letter-spacing: -.005em; }
.stanza .line:empty { display: none; }
.stanza-label {
  display: inline-block;
  font-size: 11px;
  color: var(--accent);
  margin-bottom: 8px;
  padding: 3px 9px;
  border: 1.5px solid currentColor;
  border-radius: 999px;
}

.lyrics-empty {
  border: 2px dashed #d9cfbd;
  border-radius: 22px;
  background: var(--cream);
  padding: 36px 32px;
  text-align: center;
  color: var(--ink-2);
}
.lyrics-empty .big { font-family: var(--display); font-size: 26px; color: var(--ink); margin: 0 0 8px; }
.lyrics-empty p { margin: 6px auto; max-width: 480px; line-height: 1.6; }
.lyrics-empty code { font-family: var(--mono); font-size: 13px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }

/* more records */
.more {
  max-width: 820px;
  margin: 0 auto;
  padding: 0 clamp(16px, 4vw, 40px) 72px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.more a {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border: 1.5px solid var(--ink);
  border-radius: 18px;
  text-decoration: none;
  background: #fff;
  box-shadow: 0 3px 0 var(--ink);
  transition: transform .25s var(--ease-out), box-shadow .25s var(--ease-out), background .2s;
  min-width: 0;
}
.more a:hover { transform: translateY(-3px); box-shadow: 0 6px 0 var(--ink); background: var(--cream); }
.more a.next { flex-direction: row-reverse; text-align: right; }
.more img { width: 56px; height: 56px; border-radius: 50%; flex: none; transition: transform .8s var(--ease-out); }
.more a:hover img { transform: rotate(180deg); }
.more .m-k { color: var(--muted); font-size: 10px; display: block; margin-bottom: 3px; }
.more .m-t { font-weight: 700; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.more .m-txt { min-width: 0; }

/* sticky mini player */
.mini {
  position: fixed;
  left: 50%;
  bottom: 18px;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 14px;
  width: min(560px, calc(100vw - 32px));
  padding: 10px 18px 10px 10px;
  background: #fff;
  border: 1.5px solid var(--ink);
  border-radius: 999px;
  box-shadow: 0 4px 0 var(--ink), 0 18px 40px -16px rgba(26,23,20,.35);
  transform: translate(-50%, calc(100% + 40px));
  transition: transform .55s var(--ease-spring);
}
.mini.show { transform: translate(-50%, 0); }
.mini-disc { width: 44px; height: 44px; border-radius: 50%; flex: none; animation: spin 1.8s linear infinite; animation-play-state: paused; }
.is-playing .mini-disc { animation-play-state: running; }
.mini-btn {
  width: 40px; height: 40px; flex: none;
  border-radius: 50%;
  border: 1.5px solid var(--ink);
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  display: grid; place-items: center;
  position: relative;
}
.mini-btn svg { position: absolute; width: 16px; height: 16px; transition: transform .35s var(--ease-spring), opacity .2s; }
.mini-btn .i-pause { opacity: 0; transform: scale(.4); }
.is-playing .mini-btn .i-play { opacity: 0; transform: scale(.4); }
.is-playing .mini-btn .i-pause { opacity: 1; transform: none; }
.mini-body { flex: 1; min-width: 0; }
.mini-title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-title span { font-weight: 400; color: var(--ink-2); }
.mini .progress { height: 14px; margin-top: 2px; }
.mini .progress::before, .mini .progress-fill { height: 4px; margin-top: -2px; }
.mini .progress-knob { display: none; }
.mini-time { color: var(--muted); font-size: 11px; flex: none; }

/* scroll reveal */
.reveal { opacity: 0; transform: translateY(18px); transition: opacity .8s var(--ease-out), transform .8s var(--ease-out); }
.reveal.in { opacity: 1; transform: none; }

/* ---------- keyframes ---------- */
@keyframes fadeIn { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
@keyframes discIn { from { opacity: 0; transform: translateY(46px) scale(.88); } }
@keyframes deckIn { from { opacity: 0; transform: translateX(-36px) rotate(-3deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes ringSpin { to { transform: scale(1) rotate(360deg); } }
@keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.45); } }
@keyframes eq { from { height: 20%; } to { height: 100%; } }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; }
  .turntable { max-width: 480px; }
  .info { text-align: left; }
}
@media (max-width: 560px) {
  .topbar-meta { display: none; }
  .more { grid-template-columns: 1fr; }
  .more a.next { flex-direction: row; text-align: left; }
  .player { gap: 16px; }
  .play-btn { width: 66px; height: 66px; }
  .lyrics-empty { padding: 28px 18px; }
  .mini-time { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

  </style>
</head>

  <script>
/* ============================================================
   FRONTPAGE SCRIPT
   ============================================================ */
function runHome() {
/* ============================================================
   Home page: an endless, physics-driven row of vinyl records.
   - a spring pulls the row toward the selected record
   - drag with momentum, mouse wheel / trackpad, arrow keys
   - records "roll" while moving, the centred one slowly turns
   ============================================================ */
(() => {
  'use strict';

  const songs = window.SONGS || [];
  const n = songs.length;
  if (!n) return;

  const $ = (s) => document.querySelector(s);
  const mod = (a, b) => ((a % b) + b) % b;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const pad = (v) => String(v).padStart(2, '0');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const home = $('#home');
  const carousel = $('#carousel');
  const glow = $('#glow');
  const kickerEl = $('#nowKicker');
  const titleEl = $('#nowTitle');
  const artistEl = $('#nowArtist');
  const dotsEl = $('#dots');

  $('#count').textContent = pad(n);

  // Preload every vinyl so recycling slots never flashes
  songs.forEach((s) => { const im = new Image(); im.src = s.vinyl; });

  /* ---------- where to start ---------- */
  let start = Math.max(0, songs.findIndex((s) => s.featured));
  try {
    const last = sessionStorage.getItem('karaoke:last');
    const i = songs.findIndex((s) => s.id === last);
    if (i >= 0) start = i;
  } catch (e) { /* storage blocked: fine */ }

  /* ---------- sizing ---------- */
  let S = 400; // diameter of the centred record in px
  function measure() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    S = w < 700
      ? Math.min(w * 0.66, h * 0.42)
      : Math.min(h * 0.46, w * 0.34, 520);
    S = Math.max(200, Math.round(S));
    home.style.setProperty('--S', S + 'px');
  }
  measure();
  window.addEventListener('resize', measure);

  /* ---------- record slots (recycled endlessly) ---------- */
  const HALF = 5;              // records rendered each side of centre
  const SLOTS = HALF * 2 + 1;
  const slots = [];
  for (let i = 0; i < SLOTS; i++) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'disc';
    el.tabIndex = -1;
    el.innerHTML =
      '<span class="disc-lift">' +
        '<span class="disc-ring"></span>' +
        '<span class="disc-shadow"></span>' +
        '<img class="disc-img" alt="" draggable="false">' +
        '<span class="disc-sheen"></span>' +
      '</span>';
    carousel.appendChild(el);
    slots.push({
      el,
      lift: el.querySelector('.disc-lift'),
      img: el.querySelector('.disc-img'),
      vi: null,
      angle: Math.random() * 360,
      center: false,
    });
  }

  function assign(slot, vi) {
    slot.vi = vi;
    const song = songs[mod(vi, n)];
    if (slot.img.getAttribute('src') !== song.vinyl) slot.img.src = song.vinyl;
    slot.el.dataset.vi = vi;
    slot.el.setAttribute('aria-label', `${song.title} by ${song.artist}`);
  }

  /* layout curve: smooth everywhere so motion never "kinks" */
  const E = 1 - Math.exp(-2.2);
  function place(d) {
    const a = Math.abs(d);
    const s = Math.sign(d);
    const x = s * S * (0.40 * a + 0.28 * (1 - Math.exp(-2.2 * a)) / E);
    const scale = 0.54 + 0.46 * Math.exp(-2 * a * a);
    const opacity = clamp((3.9 - a) / 0.9, 0, 1);
    return { a, x, scale, opacity };
  }

  /* ---------- motion state ---------- */
  let pos = start;     // continuous position (record index under the needle)
  let target = start;  // where the spring is pulling
  let vel = 0;         // records / second
  let drag = null;
  let suppressClick = false;
  let leaving = false;

  function render(dt, dPos) {
    const base = Math.round(pos);
    for (let k = -HALF; k <= HALF; k++) {
      const vi = base + k;
      const slot = slots[mod(vi, SLOTS)];
      if (slot.vi !== vi) assign(slot, vi);

      const { a, x, scale, opacity } = place(vi - pos);

      // the centre record turns slowly; all records roll as the row moves
      if (!reduceMotion) slot.angle += 14 * Math.exp(-4 * a * a) * dt - dPos * 75;

      const st = slot.el.style;
      st.transform = `translate3d(${x.toFixed(2)}px,0,0) scale(${scale.toFixed(4)})`;
      st.opacity = opacity.toFixed(3);
      st.zIndex = String(1000 - Math.round(a * 100));
      st.visibility = opacity > 0.001 ? 'visible' : 'hidden';
      slot.img.style.transform = `rotate(${slot.angle.toFixed(2)}deg)`;

      const isCenter = a < 0.5;
      if (isCenter !== slot.center) {
        slot.center = isCenter;
        slot.el.classList.toggle('is-center', isCenter);
      }
    }
  }

  /* ---------- the "now playing" title block ---------- */
  let current = null;
  let lastRounded = Math.round(pos);
  const infoEls = [kickerEl, titleEl, artistEl];
  let infoBusy = false;
  let infoWanted = null;
  let infoDir = 1;

  function fillInfo(i) {
    const s = songs[i];
    kickerEl.innerHTML = `<b>No. ${pad(i + 1)}</b> &nbsp;·&nbsp; ${escapeHtml(s.album)} &nbsp;·&nbsp; ${s.year}`;
    titleEl.textContent = s.title;
    artistEl.textContent = s.artist;
  }

  function runInfo() {
    if (reduceMotion) { fillInfo(infoWanted); return; }
    infoBusy = true;
    const dir = infoDir;
    const outs = infoEls.map((el, j) => el.animate(
      [{ opacity: 1, transform: 'none' },
       { opacity: 0, transform: `translateX(${-dir * 18}px)` }],
      { duration: 150, delay: j * 25, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' }
    ).finished);
    Promise.all(outs).then(() => {
      const shown = infoWanted;
      fillInfo(shown);
      const ins = infoEls.map((el, j) => {
        el.getAnimations().forEach((an) => an.cancel());
        return el.animate(
          [{ opacity: 0, transform: `translateX(${dir * 22}px)` },
           { opacity: 1, transform: 'none' }],
          { duration: 420, delay: j * 45, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }
        ).finished;
      });
      Promise.all(ins).then(() => {
        infoBusy = false;
        if (infoWanted !== shown) runInfo();
      });
    });
  }

  function setInfo(i, dir) {
    infoWanted = i;
    infoDir = dir || 1;
    if (!infoBusy) runInfo();
  }

  /* dots */
  const dots = songs.map((s, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'dot';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-label', `${s.title} by ${s.artist}`);
    b.addEventListener('click', () => goToIndex(i));
    dotsEl.appendChild(b);
    return b;
  });

  function updateCurrent(first) {
    const r = Math.round(pos);
    const i = mod(r, n);
    if (i === current) return;
    const dir = Math.sign(r - lastRounded) || 1;
    lastRounded = r;
    current = i;
    if (first) fillInfo(i); else setInfo(i, dir);
    dots.forEach((d, j) => {
      d.classList.toggle('active', j === i);
      d.setAttribute('aria-selected', j === i ? 'true' : 'false');
    });
    glow.style.setProperty('--glow', songs[i].accent || '#ff5a36');
  }

  /* ---------- navigation ---------- */
  function step(dir) {
    if (leaving) return;
    target = clamp(Math.round(target) + dir, Math.round(pos) - 4, Math.round(pos) + 4);
  }

  function goToIndex(i) {
    if (leaving) return;
    const from = mod(Math.round(target), n);
    let delta = mod(i - from, n);
    if (delta > n / 2) delta -= n;
    target = Math.round(target) + delta;
  }

  function open(i) {
    if (leaving) return;
    const song = songs[i];
    const needsMove = mod(Math.round(target), n) !== i || Math.abs(target - pos) > 0.05;
    if (needsMove) goToIndex(i);
    leaving = true;
    try { sessionStorage.setItem('karaoke:last', song.id); } catch (e) {}
    setTimeout(() => {
      document.body.classList.add('is-leaving');
      setTimeout(() => {
        location.href = `index.html?song=${encodeURIComponent(song.id)}`;
      }, reduceMotion ? 0 : 520);
    }, needsMove && !reduceMotion ? 420 : 0);
  }

  $('#prevBtn').addEventListener('click', () => step(-1));
  $('#nextBtn').addEventListener('click', () => step(1));
  $('#openBtn').addEventListener('click', () => open(mod(Math.round(target), n)));

  carousel.addEventListener('click', (e) => {
    if (suppressClick) return;
    const disc = e.target.closest('.disc');
    if (!disc) return;
    const vi = Number(disc.dataset.vi);
    if (Math.abs(vi - pos) < 0.5 && Math.abs(vi - target) < 0.5) open(mod(vi, n));
    else target = vi;
  });

  window.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
    else if ((e.key === 'Enter' || e.key === ' ') && (e.target === document.body || e.target === carousel)) {
      open(mod(Math.round(target), n));
      e.preventDefault();
    }
  });

  /* wheel & trackpad */
  let wheelAcc = 0;
  let wheelLast = 0;
  let wheelStep = 0;
  window.addEventListener('wheel', (e) => {
    if (e.ctrlKey) return; // let pinch-zoom through
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
    const d = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * unit;
    e.preventDefault();
    const now = performance.now();
    if (now - wheelLast > 220) wheelAcc = 0;
    wheelLast = now;
    wheelAcc += d;
    if (Math.abs(wheelAcc) > 50 && now - wheelStep > 130) {
      step(Math.sign(wheelAcc));
      wheelAcc = 0;
      wheelStep = now;
    }
  }, { passive: false });

  /* drag with momentum */
  const dragUnit = () => S * 0.62; // px of drag per record
  carousel.addEventListener('pointerdown', (e) => {
    if (leaving || (e.pointerType === 'mouse' && e.button !== 0)) return;
    drag = { id: e.pointerId, x0: e.clientX, p0: pos, lastX: e.clientX, lastT: performance.now(), v: 0, moved: false };
  });
  window.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x0;
    if (!drag.moved) {
      if (Math.abs(dx) < 6) return;
      drag.moved = true;
      drag.x0 = e.clientX; // no jump when the drag kicks in
      drag.p0 = pos;
      vel = 0;
      try { carousel.setPointerCapture(drag.id); } catch (err) {}
      carousel.classList.add('dragging');
    }
    const now = performance.now();
    const ddt = (now - drag.lastT) / 1000;
    pos = drag.p0 - (e.clientX - drag.x0) / dragUnit();
    if (ddt > 0) {
      const inst = -(e.clientX - drag.lastX) / dragUnit() / ddt;
      drag.v = drag.v * 0.6 + inst * 0.4;
    }
    drag.lastX = e.clientX;
    drag.lastT = now;
  });
  function endDrag(e) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    if (drag.moved) {
      const idle = performance.now() - drag.lastT;
      const v = idle > 90 ? 0 : clamp(drag.v, -14, 14);
      vel = v;
      target = Math.round(pos + clamp(v * 0.2, -3, 3));
      suppressClick = true;
      setTimeout(() => { suppressClick = false; }, 0);
      carousel.classList.remove('dragging');
    }
    drag = null;
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  /* back/forward cache: undo the leaving state */
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) {
      leaving = false;
      document.body.classList.remove('is-leaving');
    }
  });

  /* ---------- main loop ---------- */
  let last = performance.now();
  let prevPos = pos;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!drag || !drag.moved) {
      if (reduceMotion) {
        pos = target; vel = 0;
      } else {
        // slightly under-damped spring: settles with a soft, natural ease
        const k = 140;
        const c = 2 * Math.sqrt(k) * 0.9;
        vel += (k * (target - pos) - c * vel) * dt;
        pos += vel * dt;
        if (Math.abs(target - pos) < 0.0004 && Math.abs(vel) < 0.002) { pos = target; vel = 0; }
      }
    }
    const dPos = pos - prevPos;
    prevPos = pos;
    render(dt, dPos);
    updateCurrent(false);
    requestAnimationFrame(frame);
  }

  // first paint + staggered entrance from the centre outwards
  render(0, 0);
  updateCurrent(true);
  slots.forEach((s) => {
    const k = Math.abs(s.vi - Math.round(pos));
    s.lift.style.setProperty('--delay', `${120 + k * 90}ms`);
  });
  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
})();

}

/* ============================================================
   SONG PAGE SCRIPT
   ============================================================ */
function runSong() {
/* ============================================================
   Song page: turntable player + static lyrics
   ============================================================ */
(() => {
  'use strict';

  const songs = window.SONGS || [];
  const n = songs.length;
  if (!n) return;

  const $ = (s) => document.querySelector(s);
  const pad = (v) => String(v).padStart(2, '0');
  const fmt = (t) => {
    if (!isFinite(t) || t < 0) return '–:––';
    const m = Math.floor(t / 60);
    return `${m}:${pad(Math.floor(t % 60))}`;
  };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- which song? ---------- */
  const params = new URLSearchParams(location.search);
  let idx = songs.findIndex((s) => s.id === params.get('song'));
  if (idx < 0) idx = 0;
  const song = songs[idx];
  try { sessionStorage.setItem('karaoke:last', song.id); } catch (e) {}

  document.title = `${song.title} — ${song.artist} · At-Home Karaoke`;
  document.documentElement.style.setProperty('--accent', song.accent || '#ff5a36');

  $('#trackNo').textContent = `Record ${pad(idx + 1)} of ${pad(n)}`;
  $('#kicker').innerHTML = `<span>Track ${pad(idx + 1)}</span><span>·</span><span>${esc(song.album)}</span><span>·</span><span>${song.year}</span>`;
  $('#title').textContent = song.title;
  $('#artist').innerHTML = `<em>by</em> ${esc(song.artist)}`;
  const record = $('#record');
  record.src = song.vinyl;
  record.alt = `${song.album} vinyl record`;
  $('#miniDisc').src = song.vinyl;
  $('#miniTitle').innerHTML = `${esc(song.title)} <span>· ${esc(song.artist)}</span>`;

  /* ---------- lyrics ---------- */
  const lyricsEl = $('#lyrics');
  // lyrics are static: they come only from js/songs.js
  (function renderLyrics(text) {
    const t = String(text || '').replace(/\r/g, '').trim();
    if (!t) {
      lyricsEl.innerHTML =
        '<div class="lyrics-empty reveal">' +
          '<p class="big">Lyrics coming soon</p>' +
          '<p>The words for this record haven’t been added yet.</p>' +
        '</div>';
      return;
    }
    t.split(/\n\s*\n/).forEach((block) => {
      const stanza = document.createElement('div');
      stanza.className = 'stanza reveal';
      block.split('\n').forEach((line) => {
        const label = line.trim().match(/^\[(.+)\]$/);
        const el = document.createElement('span');
        if (label) {
          el.className = 'stanza-label mono';
          el.textContent = label[1];
        } else {
          el.className = 'line';
          el.textContent = line.trim();
        }
        stanza.appendChild(el);
      });
      lyricsEl.appendChild(stanza);
    });
  })(song.lyrics);

  // text size for singing from the sofa
  const sizes = [18, 21, 24, 28, 32, 38, 44];
  let sizeI = Math.min(sizes.length - 1, Math.max(0, Number(store.get('karaoke:size', 2)) || 0));
  const applySize = () => { lyricsEl.style.setProperty('--lyric-size', sizes[sizeI] + 'px'); store.set('karaoke:size', sizeI); };
  applySize();
  $('#smaller').addEventListener('click', () => { sizeI = Math.max(0, sizeI - 1); applySize(); });
  $('#bigger').addEventListener('click', () => { sizeI = Math.min(sizes.length - 1, sizeI + 1); applySize(); });

  /* ---------- previous / next record ---------- */
  const prev = songs[(idx - 1 + n) % n];
  const next = songs[(idx + 1) % n];
  if (n > 1) {
    $('#more').innerHTML =
      `<a class="prev reveal" href="index.html?song=${encodeURIComponent(prev.id)}" data-transition>` +
        `<img src="${prev.vinyl}" alt=""><span class="m-txt"><span class="m-k mono">← Previous</span><span class="m-t">${esc(prev.title)}</span></span></a>` +
      `<a class="next reveal" href="index.html?song=${encodeURIComponent(next.id)}" data-transition>` +
        `<img src="${next.vinyl}" alt=""><span class="m-txt"><span class="m-k mono">Next →</span><span class="m-t">${esc(next.title)}</span></span></a>`;
  }

  /* ---------- scroll reveal ---------- */
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.reveal').forEach((el, i) => {
    el.style.transitionDelay = `${Math.min(i, 3) * 60}ms`;
    io.observe(el);
  });

  /* ---------- page transitions ---------- */
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-transition]');
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    e.preventDefault();
    if (!audio.paused) audio.pause();
    document.body.classList.add('is-leaving');
    setTimeout(() => { location.href = a.href; }, reduceMotion ? 0 : 380);
  });
  window.addEventListener('pageshow', (e) => { if (e.persisted) document.body.classList.remove('is-leaving'); });

  /* ============================================================
     Player
     ============================================================ */
  const audio = $('#audio');
  const playBtn = $('#playBtn');
  const miniBtn = $('#miniBtn');
  const statusEl = $('#status');
  const curEl = $('#cur');
  const durEl = $('#dur');
  const miniTime = $('#miniTime');
  const progress = $('#progress');
  const miniProgress = $('#miniProgress');
  const tonearm = $('#tonearm');
  const volume = $('#volume');
  const mini = $('#mini');

  const setStatus = (t) => { statusEl.textContent = t; };

  if (!song.audio) {
    playBtn.disabled = true;
    playBtn.setAttribute('aria-label', 'No track added yet');
    setStatus('Track not added yet');
    $('#volumeWrap').hidden = true;
    const note = $('#noAudio');
    note.hidden = false;
    note.innerHTML = `This record has no karaoke track yet. Drop an mp3 into <code>assets/audio/</code> and set <code>audio</code> for <code>${esc(song.id)}</code> in <code>js/songs.js</code>.`;
  } else {
    audio.src = song.audio;
  }

  // volume
  audio.volume = Number(store.get('karaoke:vol', 0.9));
  volume.value = audio.volume;
  volume.addEventListener('input', () => { audio.volume = Number(volume.value); store.set('karaoke:vol', volume.value); });

  function toggle() {
    if (!song.audio) return;
    if (audio.paused) {
      if (audio.ended || (audio.duration && audio.currentTime >= audio.duration - 0.1)) audio.currentTime = 0;
      audio.play().catch(() => setStatus('Tap play again to start'));
    } else {
      audio.pause();
    }
  }
  playBtn.addEventListener('click', toggle);
  miniBtn.addEventListener('click', toggle);

  window.addEventListener('keydown', (e) => {
    if (e.code !== 'Space' && e.key !== 'k') return;
    if (e.target.closest && e.target.closest('button, input, textarea, a, [role="slider"]')) return;
    e.preventDefault();
    toggle();
  });

  let started = false;
  function setPlaying(p) {
    document.body.classList.toggle('is-playing', p);
    playBtn.setAttribute('aria-label', p ? 'Pause song' : 'Play song');
    if (p) { started = true; setStatus('Needle down · sing it!'); }
    updateArm();
    kickSpin();
  }
  audio.addEventListener('play', () => setPlaying(true));
  audio.addEventListener('pause', () => { setPlaying(false); if (!audio.ended) setStatus('Paused'); });
  audio.addEventListener('ended', () => { started = false; setPlaying(false); setStatus('That’s a wrap! Encore?'); setProgress(0); });
  audio.addEventListener('loadedmetadata', () => { durEl.textContent = fmt(audio.duration); });
  audio.addEventListener('error', () => { if (song.audio) setStatus('Couldn’t load the track'); });
  audio.addEventListener('seeked', () => { updateArm(); });

  /* tonearm: rests off the record, lands on the outer groove, drifts inward as the song plays */
  function updateArm() {
    const p = audio.duration ? audio.currentTime / audio.duration : 0;
    const on = !audio.paused || (started && audio.currentTime > 0);
    tonearm.style.setProperty('--arm', on ? `${(23 + p * 13).toFixed(2)}deg` : '0deg');
  }
  setInterval(() => { if (!audio.paused) updateArm(); }, 1000);

  /* progress (two bars share it) */
  let scrubbing = false;
  function setProgress(p) {
    const v = Math.min(1, Math.max(0, p));
    progress.style.setProperty('--p', v);
    miniProgress.style.setProperty('--p', v);
    progress.setAttribute('aria-valuenow', Math.round(v * 100));
    const t = audio.duration ? v * audio.duration : 0;
    curEl.textContent = fmt(t);
    miniTime.textContent = fmt(t);
  }

  function bindSeek(bar) {
    const ratio = (e) => {
      const r = bar.getBoundingClientRect();
      return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    };
    bar.addEventListener('pointerdown', (e) => {
      if (!song.audio || !audio.duration) return;
      scrubbing = true;
      bar.classList.add('scrubbing');
      bar.setPointerCapture(e.pointerId);
      setProgress(ratio(e));
    });
    bar.addEventListener('pointermove', (e) => { if (scrubbing) setProgress(ratio(e)); });
    const end = (e) => {
      if (!scrubbing) return;
      scrubbing = false;
      bar.classList.remove('scrubbing');
      audio.currentTime = ratio(e) * audio.duration;
    };
    bar.addEventListener('pointerup', end);
    bar.addEventListener('pointercancel', end);
  }
  bindSeek(progress);
  bindSeek(miniProgress);
  progress.addEventListener('keydown', (e) => {
    if (!audio.duration) return;
    if (e.key === 'ArrowRight') { audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { audio.currentTime = Math.max(0, audio.currentTime - 5); e.preventDefault(); }
    setProgress(audio.currentTime / audio.duration);
  });

  /* record spin: eases up to 33⅓ rpm and coasts down like a real platter */
  let angle = 0;
  let speed = 0; // deg / s
  let running = false;
  let lastT = 0;
  function kickSpin() {
    if (running) return;
    running = true;
    lastT = performance.now();
    requestAnimationFrame(loop);
  }
  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    const goal = audio.paused ? 0 : 200; // 33⅓ rpm ≈ 200°/s
    const rate = audio.paused ? 1.6 : 2.4;
    speed += (goal - speed) * (1 - Math.exp(-rate * dt));
    if (!reduceMotion) {
      angle = (angle + speed * dt) % 360;
      record.style.transform = `rotate(${angle.toFixed(2)}deg)`;
    }
    if (!scrubbing && audio.duration) setProgress(audio.currentTime / audio.duration);
    if (audio.paused && speed < 0.5) { running = false; return; }
    requestAnimationFrame(loop);
  }

  /* media keys / lock screen */
  if ('mediaSession' in navigator && song.audio) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: song.title, artist: song.artist, album: song.album,
        artwork: [{ src: new URL(song.vinyl, location.href).href, sizes: '752x752', type: 'image/webp' }],
      });
      navigator.mediaSession.setActionHandler('play', () => audio.play());
      navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    } catch (e) {}
  }

  /* mini player appears when the big player scrolls away */
  if (song.audio) {
    const playerEl = $('#player');
    new IntersectionObserver(([en]) => {
      const show = !en.isIntersecting && en.boundingClientRect.top < 0;
      mini.classList.toggle('show', show);
      mini.setAttribute('aria-hidden', show ? 'false' : 'true');
      miniBtn.tabIndex = show ? 0 : -1;
    }).observe(playerEl);
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
})();

}

/* ============================================================
   ROUTER: index.html shows the catalogue,
           index.html?song=<id> shows that song's page
   ============================================================ */
(function () {
  var isSong = new URLSearchParams(location.search).has('song');
  var tpl = document.getElementById(isSong ? 'tpl-song' : 'tpl-home');
  document.body.className = isSong ? 'page-song' : 'page-home';
  document.body.innerHTML = tpl.innerHTML;
  if (isSong) runSong(); else runHome();
})();
  </script>
</body>
</html>
